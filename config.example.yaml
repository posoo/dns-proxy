http:
  listen_addr: ":8080"
  read_header_timeout: 5s
  read_timeout: 15s
  write_timeout: 15s
  idle_timeout: 60s

admin:
  enabled: true
  username: admin
  password: change-me

resolvers:
  - name: cloudflare-udp
    protocol: udp
    address: "1.1.1.1:53"
    timeout: 5s
  - name: cloudflare-dot
    protocol: dot
    address: "1.1.1.1:853"
    server_name: cloudflare-dns.com
    timeout: 5s
  - name: cloudflare-doh
    protocol: doh
    url: "https://cloudflare-dns.com/dns-query"
    timeout: 5s

cache:
  enabled: true
  max_entries: 4096
  min_ttl: 1s
  max_ttl: 5m

logging:
  enabled: true
  path: "/data/dns-proxy.sqlite3"
  max_rows: 10000
